*, ::after, ::before {
  box-sizing: border-box;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
  background: #f2f2f2;
  font-size: 16px;
  line-height: 1.4;
  font-weight: 600;
  width: 100vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.pb-1 {
  padding-bottom: 8px;
}

.pb-2 {
  padding-bottom: 16px;
}

.text-center {
  text-align: center;
}

.mb-15 {
  margin-bottom: 15px;
}

#app {
  width: 100%;
  height: 100%;
  flex: 1;
  position: relative;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 0;
  transition: none; /* Disable transition to prevent Android scroll issues */
  scrollbar-width: none;
  -ms-overflow-style: none;
  /* Android webview fixes */
  -webkit-user-select: none;
  user-select: none;
  will-change: auto;
}

#app::-webkit-scrollbar {
  display: none;
}

/* Search */
.search-wrapper {
  background: white;
  padding: 16px;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
}

.search-wrapper__input {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #aaa;
}

.search-input {
  width: 100%;
  padding: 10px 12px 10px 36px;
  border-radius: 8px;
  border: 1px solid #ddd;
  font-size: 14px;
}

/* Section */
.section {
  background-color: #f2f2f2;
}

.section-footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  left: 0;
  transition: all 0.3s ease-out;
  /* Android fix: prevent z-index issues */
  z-index: 10;
}

/* Footer spacer to prevent phantom scroll */
#footer-spacer {
  width: 0;
  height: 0;
  pointer-events: none;
}

.section-container {
  background: white;
}

.section-title {
  padding: 10px 16px;
  color: #005617;
 /* font-size: 18px;  */
  font-weight: bold;
  border-bottom: 1px solid #eee;
}


.section-title.fixed {
  position: fixed;
  left: 0;
  width: 100%;
  background-color: #f2f2f2;
}

.list-item,
.help-item {
  padding: 10px 16px 10px 32px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  color: #005617;
  font-weight: bold;
}

.list-item:last-child {
  border-bottom: none;
}

.list-item:active {
  background: #f5f5f5;
}

/* FAQ */
.faq-item {
  padding: 10px 16px 10px 32px;
  color: #00A2DE;
  cursor: pointer;
  font-weight: bold;
}

.title-item {
  padding: 10px 16px 10px 22px;
  color: #333333;
  font-size: 18px;
}

.view-all {
  text-align: center;
  padding: 10px;
  color: #00A2DE;
  cursor: pointer;
  font-weight: bold;
}

.search-result-item {
  padding: 12px 16px 12px 32px;
  border-bottom: 1px solid #eee;
  cursor: pointer;
  display: flex;
  flex-direction: row;
}

/* Contact */
.contact-text {
  padding: 16px 10px;
  text-align: center;
  font-weight: bold;
}

.contact-btn {
  margin: 0 16px 16px;
  padding: 10px;
  width: calc(100% - 32px);
  border-radius: 8px;
  border: 1px solid #1976d2;
  color: #1976d2;
  background: white;
  cursor: pointer;
}


.nav-item {
  text-align: center;
  color: #777;
}

.nav-item.active {
  color: orange;
}

.spacer {
  height: 60px;
}

.load-more-container {
  text-align: center;
  padding: 8px 16px;
}

.load-more-btn {
  padding: 8px 16px;
  color: #00A2DE;
  cursor: pointer;
  font-weight: bold;
  background: none;
  border: none;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.load-more-btn:active {
  opacity: 0.7;
}

.load-more-btn.loading {
  opacity: 0.6;
  cursor: not-allowed;
  pointer-events: none;
}

.load-more-btn.loading::before {
  content: '';
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 3px solid #00A2DE;
  border-top-color: transparent;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.note-title {
  padding: 1.5rem 1rem;
  font-size: 20px;
  text-align: center;
  color: #000000;
  position: fixed;
  left: 0;
  width: 100%;
  background-color: #f2f2f2;
}

/* FAQ List Styles */
.category-title {
  padding: 12px 16px;
  font-size: 17px;
  color: #000000;
}

.faq-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.faq-item-detail {
  overflow: hidden;
  margin-bottom: 4px;
  cursor: pointer;
  transition: all 0.3s ease;
  padding: 10px 16px 10px 32px;
  pointer-events: none;
}

.faq-question {
  padding: 8px 0px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}

.faq-question-text {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  flex: 1;
}

.faq-number {
  font-weight: 700;
  min-width: 30px;
  flex-shrink: 0;
}

.faq-question-title {
  font-weight: 700;
  line-height: 1.4;
  text-align: left;
}

.faq-answer {
  padding: 8px 0px;
}


.faq-answer-content {
  display: flex;
  gap: 8px;
  align-items: flex-start;
}

.answer-prefix {
  color: red;
  font-weight: 700;
  min-width: 25px;
  flex-shrink: 0;

.answer-text {
  font-weight: 600;
  line-height: 1.6;
  text-align: left;
  flex: 1;

/**
 * SearchManager - Centralized search functionality handler
 * Manages search state and infinite scroll for help pages
 */
class SearchManager {
  #searchResults = null;
  #currentSearchPage = 1;
  #isFallback = false;
  #zeroMessage = null;
  #postMessage = null;
  #renderCallback = null;
  #itemsPerPage = 10;
  #searchQuery = '';

  /**
   * Initialize SearchManager
   * @param {Object} config - Configuration object
   * @param {Function} config.postMessage - Function to send messages to Flutter
   * @param {Function} config.renderCallback - Function to render search results
   * @param {number} config.itemsPerPage - Items per page (default 10)
   */
  constructor(config = {}) {
    this.#postMessage = config.postMessage || (() => {});
    this.#renderCallback = config.renderCallback || (() => {});
    this.#itemsPerPage = config.itemsPerPage || 10;
  }

  /**
   * Sets or appends search results
   * @public
   * @param {Object} results - Search results (can have type: 'faq' or 'manual')
   * @param {number} page - Page number (default 1). If page === 1, resets and sets new results. If page > 1, appends results.
   */
  setSearchResults(results, page = 1) {
    console.log('Setting search results - page:', page, 'results:', results);
    
    // Normalize results based on type
    let normalizedResults = results;
    
    // Check if results has a type property and extract the data structure
    if (results.type === 'faq' && results.faq) {
      normalizedResults = results.faq;
      normalizedResults.type = results.type;
      normalizedResults.zero_result = results.zero_result;
      normalizedResults.zero_msg = results.zero_msg;
      normalizedResults.fallback = results.faq.fallback;
    } else if (results.type === 'manual' && results.manual) {
      normalizedResults = results.manual;
      normalizedResults.type = results.type;
      normalizedResults.zero_result = results.zero_result;
      normalizedResults.zero_msg = results.zero_msg;
      normalizedResults.fallback = results.manual.fallback;
    }
    
    // If page === 1, reset and set new results
    if (page === 1) {
      this.#searchResults = normalizedResults;
      this.#currentSearchPage = 1;
      console.log('Search results reset and set:', normalizedResults);
    } else {
      // If page > 1, append results
      if (!this.#searchResults) return;

      // Normalize newResults based on type
      let normalizedNewResults = results;
      
      if (results.type === 'faq' && results.faq) {
        normalizedNewResults = results.faq;
      } else if (results.type === 'manual' && results.manual) {
        normalizedNewResults = results.manual;
      }

      // Handle both data structures:
      // faq-list/manual: items directly in results
      // index: items in results.faq.items
      const currentItems = this.#searchResults.faq?.items || this.#searchResults.items || [];
      const newItems = normalizedNewResults.faq?.items || normalizedNewResults.items || [];

      if (newItems.length === 0) return;

      // Merge items based on structure
      if (this.#searchResults.faq) {
        // index.js structure
        this.#searchResults.faq.items = [...currentItems, ...newItems];
        if (normalizedNewResults.faq?.pagination) {
          this.#searchResults.faq.pagination = normalizedNewResults.faq.pagination;
        }
      } else {
        // faq-list.js / manual structure
        this.#searchResults.items = [...currentItems, ...newItems];
        if (normalizedNewResults.pagination) {
          this.#searchResults.pagination = normalizedNewResults.pagination;
        }
      }

      this.#currentSearchPage = page;
      console.log('Search results appended, page:', this.#currentSearchPage);
    }
    
    // Check if this is a fallback (no results) case
    this.#isFallback = normalizedResults?.fallback || normalizedResults?.zero_result || false;
    this.#zeroMessage = normalizedResults?.zero_msg || null;
    
    console.log('Fallback mode:', this.#isFallback, 'Message:', this.#zeroMessage);
    
    // Call render callback
    this.#renderCallback();
  }

  /**
   * Check if there are more items to load
   * @public
   */
  hasMoreItemsToLoad() {
    // Handle both data structures
    const pagination = this.#searchResults?.faq?.pagination || this.#searchResults?.pagination;
    if (!pagination) return false;

    const pageCount = pagination.page_count || 1;
    const totalItemCount = pagination.total_item_count || 0;
    
    // Get items based on structure
    const currentLoadedItems = this.#searchResults?.faq?.items?.length || this.#searchResults?.items?.length || 0;

    // More items available if:
    // 1. Current page < total pages, OR
    // 2. Current loaded items < total items
    return (this.#currentSearchPage < pageCount) || (currentLoadedItems < totalItemCount);
  }

  /**
   * Gets current search state
   * @public
   */
  getState() {
    return {
      searchResults: this.#searchResults,
      currentSearchPage: this.#currentSearchPage,
      isFallback: this.#isFallback,
      zeroMessage: this.#zeroMessage,
      items: this.#searchResults?.faq?.items || this.#searchResults?.items || [],
      pagination: this.#searchResults?.faq?.pagination || this.#searchResults?.pagination,
      searchQuery: this.#searchQuery
    };
  }

  /**
   * Sets search query
   * @public
   */
  setSearchQuery(query) {
    this.#searchQuery = query;
  }

  /**
   * Resets search state
   * @public
   */
  reset() {
    this.#searchResults = null;
    this.#currentSearchPage = 1;
    this.#isFallback = false;
    this.#zeroMessage = null;
    this.#searchQuery = '';
  }

  /**
   * Gets current search page
   * @public
   */
  getCurrentSearchPage() {
    return this.#currentSearchPage;
  }

  /**
   * Gets search query
   * @public
   */
  getSearchQuery() {
    return this.#searchQuery;
  }

  /**
   * Gets items per page
   * @public
   */
  getItemsPerPage() {
    return this.#itemsPerPage;
  }

  /**
   * Gets fallback status
   * @public
   */
  isFallbackMode() {
    return this.#isFallback;
  }

  /**
   * Gets zero message
   * @public
   */
  getZeroMessage() {
    return this.#zeroMessage;
  }

  /**
   * Gets items from search results
   * @public
   */
  getItems() {
    return this.#searchResults?.faq?.items || this.#searchResults?.items || [];
  }

  /**
   * Gets pagination info
   * @public
   */
  getPagination() {
    return this.#searchResults?.faq?.pagination || this.#searchResults?.pagination;
  }

  /**
   * Post message to Flutter
   * @public
   */
  postMessageToFlutter(fncName, msg) {
    this.#postMessage(fncName, msg);
  }

  /**
   * Setup search input event listeners (keydown, blur, focus)
   * @public
   * @param {Object} config - Configuration object
   * @param {string} config.searchType - Type of search ('manual' or 'faq')
   * @param {Function} config.onSearch - Callback when search is triggered
   * @param {Function} config.onSearchStart - Optional callback triggered before search query submission
   * @param {Function} config.onFooterPositionChange - Optional callback for footer position changes (blur/focus)
   * @param {Function} config.updateSectionFooterPadding - Optional callback to update footer padding
   */
  setupSearchInputEvents(config = {}) {
    const searchInput = document.getElementById('searchInput');
    if (!searchInput) return;

    const searchType = config.searchType || 'manual';
    const onSearch = config.onSearch || (() => {});
    const onSearchStart = config.onSearchStart || (() => {});
    const onFooterPositionChange = config.onFooterPositionChange || (() => {});
    const updateSectionFooterPadding = config.updateSectionFooterPadding || (() => {});

    // Handle Enter key for search
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        
        // Only allow search if query is not empty
        if (query && query.length > 0) {
          // Call onSearchStart callback
          onSearchStart();

          // Reset search state for new search (ensures currentSearchPage is 1 and old results are cleared)
          this.reset();

          this.setSearchQuery(query);

          // Hide all sections except footer when searching
          document.querySelectorAll('.section:not(.section-footer)').forEach(section => {
            section.style.display = 'none';
          });

          // Call onSearch callback with search parameters
          onSearch({
            query: query,
            page: 1,
            type: searchType,
            limit: this.#itemsPerPage
          });
        } else {
          onSearch({ query: '' });
        }

        searchInput.blur();
      }
    });

    // Handle blur event - fix footer position
    searchInput.addEventListener('blur', (e) => {
      const sectionFooter = document.querySelector('.section-footer');
      if (sectionFooter) {
        sectionFooter.style.position = 'fixed';
        updateSectionFooterPadding();
        onFooterPositionChange('fixed');
      }
    });

    // Handle focus event - make footer relative
    searchInput.addEventListener('focus', (e) => {
      const sectionFooter = document.querySelector('.section-footer');
      const app = document.getElementById('app');
      if (sectionFooter) {
        sectionFooter.style.position = 'relative';
        if (app) {
          app.style.paddingBottom = '0';
        }
        onFooterPositionChange('relative');
      }
    });
  }

  /**
   * Renders search results HTML
   * @public
   * @returns {string} HTML string for search results
   */
  renderSearchResultsHTML() {
    // Get state
    const items = this.#searchResults?.faq?.items || this.#searchResults?.items || [];
    const pagination = this.#searchResults?.faq?.pagination || this.#searchResults?.pagination;
    const type = this.#searchResults?.type || 'faq';
    const classTitle = type === 'faq' ? '' : 'text-green';
    const pageCount = pagination?.page_count || 1;
    const totalItemCount = pagination?.total_item_count || items.length;

    // Handle fallback case (zero results)
    if (this.#isFallback) {
      let html = `
        <div class="section-title">検索結果</div>
         <div class="section-container">`;
      
      // Show zero message
      if (this.#zeroMessage) {
        html += `
          <div class="zero-message" style="padding: 20px; text-align: center;">${this.#zeroMessage}</div>
        </div>`;
      }

      // Show recommended section title
      html += `
        <div class="section-title">おすすめのヘルプ</div>
        <div class="section-container">`;
      
      // Show recommended items
      if (items.length === 0) {
        html += '<div class="no-recommended" style="padding: 20px; text-align: center;">おすすめのFAQがありません</div>';
      } else {
        items.forEach(item => {
          const displayText = item.title || item.question || '';
          html += `
            <div class="search-result-item" data-id="${item.id || ''}" data-type="${type}" style="border-bottom: 1px solid #f0f0f0;">
              <div class="result-content">
                <div class="result-title ${classTitle}">${displayText}</div>
              </div>
            </div>
          `;
        });
      }

      html += '</div>';
      return html;
    }

    // Handle normal search results
    if (items.length === 0) {
      return '<div class="no-results">検索結果が見つかりません</div>';
    }

    let html = `
      <div class="section-title">検索結果</div>
      <div class="section-container">`;
    
    items.forEach(item => {
      // Handle both 'title' and 'question' fields
      const displayText = item.title || item.question || '';
      
      html += `
        <div class="search-result-item" data-id="${item.id || ''}" data-redirect="${item.help_redirect || ''}" data-type="${type}">
          <div class="result-content">
            <div class="result-title ${classTitle}">${displayText}</div>
          </div>
        </div>
      `;
    });

    // Add load-more button if more items available
    if (this.hasMoreItemsToLoad()) {
      html += `
        <div class="load-more-container">
          <span class="load-more-btn" data-page="search">もっと見る</span>
        </div>
      `;
    } else if (totalItemCount > 0) {
      // Show "end of results" message
      html += `
        <div class="end-of-results" style="padding: 20px; text-align: center; color: #aaa; font-size: 14px;">
          すべての結果を表示しました (${items.length}/${totalItemCount})
        </div>
      `;
    }

    html += '</div>';
    return html;
  }
}

</script>

(function() {
  class HelpListFAQ {
    #data = null;
    #searchManager = null;
    #categoryPagination = {}; // Track pagination state for each category
    #itemsPerPage = 5;

    constructor() {
      // Initialize SearchManager
      this.#searchManager = new SearchManager({
        postMessage: (fncName, msg) => this.postMessage(fncName, msg),
        renderCallback: () => this.renderSearchResults(),
        itemsPerPage: 10
      });
    }

    /**
     * Initializes the help page with data from Flutter
     * @public
     * @param {Object} data - Data structure containing faq object
     */
    init(data) {
      try {
        this.#data = data;
        // Initialize pagination state for each category
        Object.keys(data.faq || {}).forEach(categoryId => {
          const category = data.faq[categoryId];
          this.#categoryPagination[categoryId] = {
            currentPage: 1,
            pageCount: category.pagination.page_count || 1,
            total: category.pagination.total_item_count || category.items.length
          };
        });
        this.render();
        this.#setupStaticEventListeners();
      } catch (error) {
        console.error('Failed to initialize help page:', error);
        throw error;
      }
    }

    /**
     * Sends message to Flutter app
     * @private
     */
    postMessage(fncName, msg) {
      try {
        if (window[fncName]?.postMessage) {
          window[fncName].postMessage(JSON.stringify(msg));
        } else {
          console.warn(`JavaScript channel ${fncName} is not defined`);
        }  
      } catch (error) {
        console.error('An error occurred while calling the postMessage function:', error);
      }
    }

    /**
     * Renders the help page UI
     * @private
     */
    render() { 
      if (!this.#data || !this.#data.faq) {
        console.warn('Data is not initialized. Call init() first.');
        return;
      }

      const app = document.getElementById("app");
      if (!app) {
        console.warn('App element not found in DOM');
        return;
      }

      const faqObj = this.#data.faq;
      const categoriesHtml = Object.keys(faqObj).map(categoryId => {
        const category = faqObj[categoryId];
        const pagination = this.#categoryPagination[categoryId];
        const itemsToDisplay = Math.min(this.#itemsPerPage, category.items.length);
        const hasMore = pagination.currentPage < pagination.pageCount;
        
        return `
          <div class="title-item" data-id="${categoryId}">${category.cate_name}</div>

          ${category.items.slice(0, itemsToDisplay).map(faq => `

    /**
     * Updates app padding-bottom based on section-footer height
     * @private
     */
    #updateSectionFooterPadding() {
      // Use requestAnimationFrame to ensure DOM is fully rendered
      requestAnimationFrame(() => {
        const app = document.getElementById("app");
        const sectionFooter = document.querySelector(".section-footer");
        
        if (!app || !sectionFooter) return;
        
        // Get the height of section-footer
        const footerHeight = sectionFooter.offsetHeight;
        
        // Set padding-bottom of app to match footer height
        app.style.paddingBottom = `${footerHeight}px`;
        
        console.log('Footer height:', footerHeight, 'px');
      });
    }

    /**
     * Renders search results
     * @private
     */
    /**
     * Renders search results
     * @private
     */
    renderSearchResults() {
      const resultsContainer = document.getElementById("searchResults");
      if (!resultsContainer) return;

      // Get HTML from SearchManager
      const html = this.#searchManager.renderSearchResultsHTML();
      resultsContainer.innerHTML = html;
    }

    /**
     * Sets or appends search results
     * Automatically detects whether to reset (page 1) or append based on existing results
     * @public
     * @param {Object} results - Search results containing items with fallback status
     */
    setSearchResults(results) {
      // Auto-detect: if we have existing results, this is an append operation
      const hasExistingResults = this.#searchManager.getItems().length > 0;
      const page = hasExistingResults ? this.#searchManager.getCurrentSearchPage() + 1 : 1;
      
      this.#searchManager.setSearchResults(results, page);
      this.renderSearchResults();
      this.#setupDynamicEventListeners();
      
      // Remove loading state when appending (page > 1)
      if (page > 1) {
        this.removeLoadMoreButtonLoadingState();
      }
    }

    /**
     * Removes loading state from search load-more button
     * @private
     */
    removeLoadMoreButtonLoadingState() {
      const searchResults = document.getElementById('searchResults');
      if (!searchResults) return;
      
      const loadMoreBtn = searchResults.querySelector('.load-more-btn[data-page="search"]');
      if (loadMoreBtn) {
        loadMoreBtn.classList.remove('loading');
      }
    }

    /**
     * Updates data after resetSearch and re-renders the page
     * @public
     * @param {Object} data - New data structure from app
     */
    updateDataAfterReset(data) {
      try {
        this.#data = data;
        
        // Reset pagination state for each category
        this.#categoryPagination = {};
        Object.keys(data.faq || {}).forEach(categoryId => {
          const category = data.faq[categoryId];
          this.#categoryPagination[categoryId] = {
            currentPage: 1,
            pageCount: category.pagination.page_count || 1,
            total: category.pagination.total_item_count || category.items.length
          };
        });

        // Reset search state
        this.#searchManager.reset();

        // Clear search input
        const searchInput = document.getElementById("searchInput");
        if (searchInput) {
          searchInput.value = '';
        }

        document.getElementById("searchResults").innerHTML = '';

        // Re-render and setup static event listeners only (they're reused)
        this.render();
        this.#setupStaticEventListeners();

        console.log('Data updated after reset');
      } catch (error) {
        console.error('Error updating data after reset:', error);
      }
    }

    /**
     * Sets up static event listeners (called only once)
     * @private
     */
    #setupStaticEventListeners() {
      // Search input
      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        // Setup search input events through SearchManager
        this.#searchManager.setupSearchInputEvents({
          searchType: 'faq',
          onSearch: (params) => this.postMessage('search', params),
          updateSectionFooterPadding: () => this.#updateSectionFooterPadding()
        });
      }

      // Combined event delegation for FAQ items and load-more buttons
      const sectionContainer = document.querySelector('.section-container');
      if (sectionContainer) {
        sectionContainer.addEventListener('click', (e) => {
          // Handle FAQ item clicks
          const faqItem = e.target.closest('.faq-item');
          if (faqItem) {
            const id = faqItem.dataset.id;
            this.postMessage('selectFaq', {
              type: 'faq',
              id: id
            });
            return;
          }

          // Handle load-more button clicks
          const loadMoreBtn = e.target.closest('.load-more-btn');
          if (loadMoreBtn) {
            const categoryId = loadMoreBtn.getAttribute('data-category-id');
            const pagination = this.#categoryPagination[categoryId];
            
            if (pagination) {
              // Add loading state
              loadMoreBtn.classList.add('loading');
              
              const nextPage = pagination.currentPage + 1;
              console.log('Loading more FAQs for category:', {
                categoryId: categoryId,
                page: nextPage,
                limit: this.#itemsPerPage
              });
              
              this.postMessage('loadMoreCategory', {
                categoryId: categoryId,
                page: nextPage,
                limit: this.#itemsPerPage
              });
            }
          }
        });
      }

      // Search results container with event delegation (set up only once)
      const searchResults = document.getElementById('searchResults');
      if (searchResults) {
        searchResults.addEventListener('click', (e) => {
          // Handle load-more button clicks
          const loadMoreBtn = e.target.closest('.load-more-btn[data-page="search"]');
          if (loadMoreBtn) {
            // Add loading state
            loadMoreBtn.classList.add('loading');
            
            const nextPage = this.#searchManager.getCurrentSearchPage() + 1;
            
            this.postMessage('search', {
              query: this.#searchManager.getSearchQuery(),
              page: nextPage,
              limit: 10,
              type: 'faq'
            });
            return;
          }

          // Handle search result items click
          const resultItem = e.target.closest('.search-result-item');
          if (resultItem) {
            const id = resultItem.dataset.id;
            console.log('Search result item clicked - id:', id);
            this.postMessage('selectFaq', {
              type: 'faq',
              id: id,
            });
          }
        });
      }

      // Redirect page clicks
      document.querySelectorAll('.redirect-page').forEach(item => {
        item.addEventListener('click', () => {
          const page = item.dataset.page;
          
          this.postMessage('redirectPage', {
            page: page
          });
        });
      });

      // Setup ResizeObserver to monitor section-footer height changes
      const sectionFooter = document.querySelector('.section-footer');
      if (sectionFooter) {
        const resizeObserver = new ResizeObserver(() => {
          this.#updateSectionFooterPadding();
        });
        resizeObserver.observe(sectionFooter);
      }
    }

    /**
     * Sets up dynamic event listeners (setup/re-setup for search results)
     * Note: Event delegation listeners are set up only once in #setupStaticEventListeners()
     * This method is kept as a no-op for backwards compatibility but listeners won't be recreated
     * @private
     */
    #setupDynamicEventListeners() {
      // Listeners for search results are now set up once in #setupStaticEventListeners()
      // No need to recreate them on each setSearchResults() call
    }

    /**
     * Adds more FAQs for a specific category
     * @public
     * @param {string} categoryId - The category ID
     * @param {Object} newFaqs - Object containing pagination, items, and html properties
     */
    addMoreFAQsForCategory(categoryId, newFaqs) {
      try {
        const categoryStr = String(categoryId);
        if (!this.#data.faq[categoryStr]) {
          console.warn(`Category with ID ${categoryId} not found`);
          return;
        }

        // Extract new FAQ items from the newFaqs object
        const faqItems = newFaqs.items || [];
        
        // Save old item count before adding new items
        const oldItemsCount = this.#data.faq[categoryStr].items.length;
        
        // Add new FAQs to existing array
        this.#data.faq[categoryStr].items.push(...faqItems);

        // Update pagination information
        if (newFaqs.pagination) {
          this.#data.faq[categoryStr].pagination = newFaqs.pagination;
        }

        // Store HTML if provided
        if (newFaqs.html) {
          this.#data.faq[categoryStr].html = newFaqs.html;
        }

        // Update pagination state
        if (this.#categoryPagination[categoryStr]) {
          this.#categoryPagination[categoryStr].currentPage += 1;
          this.#categoryPagination[categoryStr].pageCount = newFaqs.pagination?.page_count || this.#categoryPagination[categoryStr].pageCount;
          this.#categoryPagination[categoryStr].total = this.#data.faq[categoryStr].pagination.total_item_count || this.#data.faq[categoryStr].items.length;
        }

        // Re-render the specific category section with old item count reference
        this.renderCategorySection(categoryStr, oldItemsCount);
        
        // Remove loading state from the button
        this.removeLoadingState(categoryStr);

        console.log(`Added ${faqItems.length} more FAQs for category ${categoryId}`);
      } catch (error) {
        console.error('Error adding more FAQs:', error);
        // Remove loading state even on error
        this.removeLoadingState(categoryId);
      }
    }

    /**
     * Removes loading state from load-more button
     * @private
     * @param {string} categoryId - The category ID
     */
    removeLoadingState(categoryId) {
      const categoryStr = String(categoryId);
      const sectionContainer = document.querySelector('.section-container');
      if (!sectionContainer) return;
      
      const loadMoreBtn = sectionContainer.querySelector(`.load-more-btn[data-category-id="${categoryStr}"]`);
      if (loadMoreBtn) {
        loadMoreBtn.classList.remove('loading');
      }
    }

    /**
     * Re-renders a specific category section
     * @private
     * @param {string} categoryId - The category ID to re-render
     * @param {number} oldItemsCount - The number of items before adding new ones (optional)
     */
    renderCategorySection(categoryId, oldItemsCount = null) {
      const categoryStr = String(categoryId);
      const category = this.#data.faq[categoryStr];
      if (!category) return;

      const sectionContainer = document.querySelector('.section-container');
      if (!sectionContainer) return;

      const pagination = this.#categoryPagination[categoryStr];
      // Get all loaded items (will be displayed in full)
      const itemsToDisplay = category.items.length;
      // Check if there are more pages to load
      const shouldShowLoadMore = pagination.currentPage < pagination.pageCount;

      // Find current category items in DOM and replace them
      const titleItem = sectionContainer.querySelector(`[data-id="${categoryStr}"]`);
      if (!titleItem) return;

      // Find and remove old load-more button (if exists)
      let currentNode = titleItem.nextElementSibling;
      while (currentNode && currentNode.classList.contains('faq-item')) {
        currentNode = currentNode.nextElementSibling;
      }
      if (currentNode && currentNode.classList.contains('load-more-container')) {
        const oldLoadMoreBtn = currentNode;
        currentNode = currentNode.nextElementSibling;
        oldLoadMoreBtn.remove();
      }

      // Build HTML for new FAQ items (from previous loaded count to new loaded count)
      // Use oldItemsCount if provided (passed from addMoreFAQsForCategory), otherwise calculate it
      const startIndex = oldItemsCount !== null ? oldItemsCount : (this.#categoryPagination[categoryStr].currentLoaded - this.#itemsPerPage);
      const newFaqsHtml = category.items.slice(startIndex, itemsToDisplay).map(faq => `
        <div class="faq-item" data-id="${faq.id}">${faq.question}</div>
      `).join("");

      // Find the last faq-item and insert new items after it
      let lastFaqItem = titleItem;
      let checkNode = titleItem.nextElementSibling;
      while (checkNode && checkNode.classList.contains('faq-item')) {
        lastFaqItem = checkNode;
        checkNode = checkNode.nextElementSibling;
      }

      // Insert new FAQ items after the last faq-item
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = newFaqsHtml;
      while (tempDiv.firstChild) {
        lastFaqItem.parentNode.insertBefore(tempDiv.firstChild, lastFaqItem.nextSibling);
        lastFaqItem = lastFaqItem.nextSibling;
      }

      // Add load-more button or end-of-results message
      if (shouldShowLoadMore) {
        const loadMoreContainer = document.createElement('div');
        loadMoreContainer.className = 'load-more-container';
        
        const newLoadMoreBtn = document.createElement('span');
        newLoadMoreBtn.className = 'load-more-btn';
        newLoadMoreBtn.setAttribute('data-category-id', categoryStr);
        newLoadMoreBtn.textContent = 'もっと見る';
        
        loadMoreContainer.appendChild(newLoadMoreBtn);
        lastFaqItem.parentNode.insertBefore(loadMoreContainer, lastFaqItem.nextSibling);

        // Event listener is now handled by event delegation in #setupStaticEventListeners
      } else {
        // Show end-of-results message
        const endOfResultsDiv = document.createElement('div');
        endOfResultsDiv.className = 'end-of-results';
        endOfResultsDiv.style.cssText = 'padding: 20px; text-align: center; color: #aaa; font-size: 14px;';
        endOfResultsDiv.textContent = `すべての結果を表示しました (${itemsToDisplay}/${pagination.total})`;
        
        lastFaqItem.parentNode.insertBefore(endOfResultsDiv, lastFaqItem.nextSibling);
      }

      console.log(`Rendered category section for ${categoryId}, displaying ${itemsToDisplay} items`);
    }
  }

  // Initialize
  try {
    const helpPageController = new HelpListFAQ();
    window.helpPageController = helpPageController; // Expose to global scope for Flutter to call init()

    // Initialize function to be called from Flutter
    window.initHelpPage = function(data) { 
      let error = null;
      let isSuccess = false;
      try {
        helpPageController.init(data);
        isSuccess = true;
      } catch (err) {
        error = err.message;
      }
      
      helpPageController.postMessage('loadFinished', {
        error: error,
        success: isSuccess
      });
      
      return isSuccess;
    }

    // Send notification that JavaScript is loaded
    helpPageController.postMessage('javascriptLoaded', { success: true });
  } catch (error) {
    console.error('An error occurred while initializing the FAQ list:', error);
  }
})();
