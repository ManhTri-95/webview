/**
 * SearchManager - Centralized search functionality handler
 * Manages search state and infinite scroll for help pages
 */
class SearchManager {
  #searchResults = null;
  #currentSearchPage = 1;
  #isFallback = false;
  #zeroMessage = null;
  #postMessage = null;
  #renderCallback = null;
  #itemsPerPage = 10;
  #searchQuery = '';

  /**
   * Initialize SearchManager
   * @param {Object} config - Configuration object
   * @param {Function} config.postMessage - Function to send messages to Flutter
   * @param {Function} config.renderCallback - Function to render search results
   * @param {number} config.itemsPerPage - Items per page (default 10)
   */
  constructor(config = {}) {
    this.#postMessage = config.postMessage || (() => {});
    this.#renderCallback = config.renderCallback || (() => {});
    this.#itemsPerPage = config.itemsPerPage || 10;
  }

  /**
   * Sets or appends search results
   * @public
   * @param {Object} results - Search results (can have type: 'faq' or 'manual')
   * @param {number} page - Page number (default 1). If page === 1, resets and sets new results. If page > 1, appends results.
   */
  setSearchResults(results, page = 1) {
    console.log('Setting search results - page:', page, 'results:', results);
    
    // Normalize results based on type
    let normalizedResults = results;
    
    // Check if results has a type property and extract the data structure
    if (results.type === 'faq' && results.faq) {
      normalizedResults = results.faq;
      normalizedResults.type = results.type;
      normalizedResults.zero_result = results.zero_result;
      normalizedResults.zero_msg = results.zero_msg;
      normalizedResults.fallback = results.faq.fallback;
    } else if (results.type === 'manual' && results.manual) {
      normalizedResults = results.manual;
      normalizedResults.type = results.type;
      normalizedResults.zero_result = results.zero_result;
      normalizedResults.zero_msg = results.zero_msg;
      normalizedResults.fallback = results.manual.fallback;
    }
    
    // If page === 1, reset and set new results
    if (page === 1) {
      this.#searchResults = normalizedResults;
      this.#currentSearchPage = 1;
      console.log('Search results reset and set:', normalizedResults);
    } else {
      // If page > 1, append results
      if (!this.#searchResults) return;

      // Normalize newResults based on type
      let normalizedNewResults = results;
      
      if (results.type === 'faq' && results.faq) {
        normalizedNewResults = results.faq;
      } else if (results.type === 'manual' && results.manual) {
        normalizedNewResults = results.manual;
      }

      // Handle both data structures:
      // faq-list/manual: items directly in results
      // index: items in results.faq.items
      const currentItems = this.#searchResults.faq?.items || this.#searchResults.items || [];
      const newItems = normalizedNewResults.faq?.items || normalizedNewResults.items || [];

      if (newItems.length === 0) return;

      // Merge items based on structure
      if (this.#searchResults.faq) {
        // index.js structure
        this.#searchResults.faq.items = [...currentItems, ...newItems];
        if (normalizedNewResults.faq?.pagination) {
          this.#searchResults.faq.pagination = normalizedNewResults.faq.pagination;
        }
      } else {
        // faq-list.js / manual structure
        this.#searchResults.items = [...currentItems, ...newItems];
        if (normalizedNewResults.pagination) {
          this.#searchResults.pagination = normalizedNewResults.pagination;
        }
      }

      this.#currentSearchPage = page;
      console.log('Search results appended, page:', this.#currentSearchPage);
    }
    
    // Check if this is a fallback (no results) case
    this.#isFallback = normalizedResults?.fallback || normalizedResults?.zero_result || false;
    this.#zeroMessage = normalizedResults?.zero_msg || null;
    
    console.log('Fallback mode:', this.#isFallback, 'Message:', this.#zeroMessage);
    
    // Call render callback
    this.#renderCallback();
  }

  /**
   * Check if there are more items to load
   * @public
   */
  hasMoreItemsToLoad() {
    // Handle both data structures
    const pagination = this.#searchResults?.faq?.pagination || this.#searchResults?.pagination;
    if (!pagination) return false;

    const pageCount = pagination.page_count || 1;
    const totalItemCount = pagination.total_item_count || 0;
    
    // Get items based on structure
    const currentLoadedItems = this.#searchResults?.faq?.items?.length || this.#searchResults?.items?.length || 0;

    // More items available if:
    // 1. Current page < total pages, OR
    // 2. Current loaded items < total items
    return (this.#currentSearchPage < pageCount) || (currentLoadedItems < totalItemCount);
  }

  /**
   * Gets current search state
   * @public
   */
  getState() {
    return {
      searchResults: this.#searchResults,
      currentSearchPage: this.#currentSearchPage,
      isFallback: this.#isFallback,
      zeroMessage: this.#zeroMessage,
      items: this.#searchResults?.faq?.items || this.#searchResults?.items || [],
      pagination: this.#searchResults?.faq?.pagination || this.#searchResults?.pagination,
      searchQuery: this.#searchQuery
    };
  }

  /**
   * Sets search query
   * @public
   */
  setSearchQuery(query) {
    this.#searchQuery = query;
  }

  /**
   * Resets search state
   * @public
   */
  reset() {
    this.#searchResults = null;
    this.#currentSearchPage = 1;
    this.#isFallback = false;
    this.#zeroMessage = null;
    this.#searchQuery = '';
  }

  /**
   * Gets current search page
   * @public
   */
  getCurrentSearchPage() {
    return this.#currentSearchPage;
  }

  /**
   * Gets search query
   * @public
   */
  getSearchQuery() {
    return this.#searchQuery;
  }

  /**
   * Gets items per page
   * @public
   */
  getItemsPerPage() {
    return this.#itemsPerPage;
  }

  /**
   * Gets fallback status
   * @public
   */
  isFallbackMode() {
    return this.#isFallback;
  }

  /**
   * Gets zero message
   * @public
   */
  getZeroMessage() {
    return this.#zeroMessage;
  }

  /**
   * Gets items from search results
   * @public
   */
  getItems() {
    return this.#searchResults?.faq?.items || this.#searchResults?.items || [];
  }

  /**
   * Gets pagination info
   * @public
   */
  getPagination() {
    return this.#searchResults?.faq?.pagination || this.#searchResults?.pagination;
  }

  /**
   * Post message to Flutter
   * @public
   */
  postMessageToFlutter(fncName, msg) {
    this.#postMessage(fncName, msg);
  }

  /**
   * Setup search input event listeners (keydown, blur, focus)
   * @public
   * @param {Object} config - Configuration object
   * @param {string} config.searchType - Type of search ('manual' or 'faq')
   * @param {Function} config.onSearch - Callback when search is triggered
   * @param {Function} config.onSearchStart - Optional callback triggered before search query submission
   * @param {Function} config.onFooterPositionChange - Optional callback for footer position changes (blur/focus)
   * @param {Function} config.updateSectionFooterPadding - Optional callback to update footer padding
   */
  setupSearchInputEvents(config = {}) {
    const searchInput = document.getElementById('searchInput');
    if (!searchInput) return;

    const searchType = config.searchType || 'manual';
    const onSearch = config.onSearch || (() => {});
    const onSearchStart = config.onSearchStart || (() => {});
    const onFooterPositionChange = config.onFooterPositionChange || (() => {});
    const updateSectionFooterPadding = config.updateSectionFooterPadding || (() => {});

    // Handle Enter key for search
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const query = searchInput.value.trim();
        
        // Only allow search if query is not empty
        if (query && query.length > 0) {
          // Call onSearchStart callback
          onSearchStart();

          // Reset search state for new search (ensures currentSearchPage is 1 and old results are cleared)
          this.reset();

          this.setSearchQuery(query);

          // Hide all sections except footer when searching
          document.querySelectorAll('.section:not(.section-footer)').forEach(section => {
            section.style.display = 'none';
          });

          // Call onSearch callback with search parameters
          onSearch({
            query: query,
            page: 1,
            type: searchType,
            limit: this.#itemsPerPage
          });
        } else {
          onSearch({ query: '' });
        }

        searchInput.blur();
      }
    });

    // Handle blur event - fix footer position
    searchInput.addEventListener('blur', (e) => {
      const sectionFooter = document.querySelector('.section-footer');
      if (sectionFooter) {
        sectionFooter.style.position = 'fixed';
        updateSectionFooterPadding();
        onFooterPositionChange('fixed');
      }
    });

    // Handle focus event - make footer relative
    searchInput.addEventListener('focus', (e) => {
      const sectionFooter = document.querySelector('.section-footer');
      const app = document.getElementById('app');
      if (sectionFooter) {
        sectionFooter.style.position = 'relative';
        if (app) {
          app.style.paddingBottom = '0';
        }
        onFooterPositionChange('relative');
      }
    });
  }

  /**
   * Renders search results HTML
   * @public
   * @returns {string} HTML string for search results
   */
  renderSearchResultsHTML() {
    // Get state
    const items = this.#searchResults?.faq?.items || this.#searchResults?.items || [];
    const pagination = this.#searchResults?.faq?.pagination || this.#searchResults?.pagination;
    const type = this.#searchResults?.type || 'faq';
    const classTitle = type === 'faq' ? '' : 'text-green';
    const pageCount = pagination?.page_count || 1;
    const totalItemCount = pagination?.total_item_count || items.length;

    // Handle fallback case (zero results)
    if (this.#isFallback) {
      let html = `
        <div class="section-title">検索結果</div>
         <div class="section-container">`;
      
      // Show zero message
      if (this.#zeroMessage) {
        html += `
          <div class="zero-message" style="padding: 20px; text-align: center;">${this.#zeroMessage}</div>
        </div>`;
      }

      // Show recommended section title
      html += `
        <div class="section-title">おすすめのヘルプ</div>
        <div class="section-container">`;
      
      // Show recommended items
      if (items.length === 0) {
        html += '<div class="no-recommended" style="padding: 20px; text-align: center;">おすすめのFAQがありません</div>';
      } else {
        items.forEach(item => {
          const displayText = item.title || item.question || '';
          html += `
            <div class="search-result-item" data-id="${item.id || ''}" data-type="${type}" style="border-bottom: 1px solid #f0f0f0;">
              <div class="result-content">
                <div class="result-title ${classTitle}">${displayText}</div>
              </div>
            </div>
          `;
        });
      }

      html += '</div>';
      return html;
    }

    // Handle normal search results
    if (items.length === 0) {
      return '<div class="no-results">検索結果が見つかりません</div>';
    }

    let html = `
      <div class="section-title">検索結果</div>
      <div class="section-container">`;
    
    items.forEach(item => {
      // Handle both 'title' and 'question' fields
      const displayText = item.title || item.question || '';
      
      html += `
        <div class="search-result-item" data-id="${item.id || ''}" data-redirect="${item.help_redirect || ''}" data-type="${type}">
          <div class="result-content">
            <div class="result-title ${classTitle}">${displayText}</div>
          </div>
        </div>
      `;
    });

    // Add load-more button if more items available
    if (this.hasMoreItemsToLoad()) {
      html += `
        <div class="load-more-container">
          <span class="load-more-btn" data-page="search">もっと見る</span>
        </div>
      `;
    } else if (totalItemCount > 0) {
      // Show "end of results" message
      html += `
        <div class="end-of-results" style="padding: 20px; text-align: center; color: #aaa; font-size: 14px;">
          すべての結果を表示しました (${items.length}/${totalItemCount})
        </div>
      `;
    }

    html += '</div>';
    return html;
  }
}

</script>

        window.document.body.innerHTML = '';
        return ;
      }

      
      this.data = data;
      
      // Extract FAQ data if provided
      if (data.dataFaq && Array.isArray(data.dataFaq)) {
        this.faqData = data.dataFaq;
        console.log('FAQ data extracted from setDataManual:', this.faqData);
      }
      
      console.log('Initial manual data:', this.data);

      const loadingImg = ' data-lazy-web-view-$1';
      const patternImg = new RegExp('\\s(src\="|\')', 'g');
      
      // Check if manual-content element exists in DOM
      const manualContentElement = document.getElementById('manual-content');
      this.data.content = manualContentElement 
        ? (manualContentElement.innerHTML || '').replace(patternImg, loadingImg)
        : (data.content || '').replace(patternImg, loadingImg);

      let tocContents = document.querySelectorAll('.manual-toc-content');

      if ( tocContents.length > 0 ){
        tocContents.forEach( (text, idx) => {
          this.data.tocs[idx].content = (text.innerText||'')
              .replace(patternImg, loadingImg);

          const childs = document.querySelectorAll(
              '.manual-toc-content-child[data-p-id="'+this.data.tocs[idx].id+'"]'
          );

          if (childs.length){
            childs.forEach( (child) => {
              let level = child.getAttribute('data-p-idx') || '';
              if (this.data.tocs[idx].childs && this.data.tocs[idx].childs[level])
                this.data.tocs[idx].childs[level].content = (child.innerText||'')
                    .replace(patternImg, loadingImg);
            });
          }
        });
      } else {
        // If DOM elements don't exist, use data directly from input
        if (this.data.tocs && Array.isArray(this.data.tocs)) {
          this.data.tocs.forEach((toc, idx) => {
            if (!toc.content) {
              toc.content = '';
            }
            if (!toc.childs) {
              toc.childs = {};
            }
          });
        }
      }

      tocContents = null;

      this.isAppCall = this.isAppCall || data.isAppCall;

      manualDetail.render();
    }

    removeEmptyTagsAtEnd = (html) => {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, 'text/html');
      let total = doc.body.childNodes.length;

      while ( total > 0 ) {
        total--;
        let node = doc.body.childNodes[total];
        if ( ((node.nodeType === Node.ELEMENT_NODE &&
             node.querySelector('img, video, audio, iframe, object, embed, picture') == null) ||
             node.nodeType === Node.TEXT_NODE) &&
            (node.textContent ||'').trim() === ''
        ) {
          node.remove();
        }else break;
      }

      return doc.body.innerHTML;
    }

    createContentToc () {
      if (!this.data.tocs || !Array.isArray(this.data.tocs)) {
        return '';
      }
      
      const isContentEmpty = (html) => {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        
        const hasVisibleContent = doc.body.textContent.trim() !== '' || doc.body.querySelector('img, video, audio, iframe, object, embed, picture') !== null;
        
        return !hasVisibleContent;
      };
      return this.data.tocs.map(content => {
        const childrenContent = content.childs ? Object.values(content.childs).map(child => `
              <div class="title-doc title-doc--h3" id="heading-${child.id}">
                ${child.title}
              </div>
              ${isContentEmpty(child.content) ? '' : `<div class="content">${this.removeEmptyTagsAtEnd(child.content)}</div>`}
            `).join('') : '';
        return `
            ${ content.title
            ?  `<div class="parent-content">
                <div class="section-title" id="heading-${content.id}">${content.title}</div>
                  ${isContentEmpty(content.content)
                ? ''
                : `<div class="section-container" style="padding: 15px;">${this.removeEmptyTagsAtEnd(content.content)}</div>` }
                  ${childrenContent
                ? `<div class="child-content px-15px">${childrenContent}</div>`
                : ''}
              </div>`
            : ''
        }
          `;
      }).join('');
    }

        return '<div style="text-align: center; color: #999; padding: 20px;">FAQデータがありません</div>';

      return this.faqData.map(item => `
        <div class="faq-item" data-id="${item.id}" data-type="faq">
          <div>${item.question || ''}</div>
        </div>
      `).join('');
    }

              document.querySelectorAll('.toc_container, .toc-content').forEach(section => {
                section.style.display = '';
              });
              document.getElementById('searchResults').innerHTML = '';
              this.searchManager.reset();
              // console.log('Search query is empty, reset search results and show content');
              this.postMessage('search', {
                query: '',
              });
            }
          },
          onSearchStart: () => {
            // Clear previous results
            document.getElementById('searchResults').innerHTML = '';
          },
          onFooterPositionChange: (position) => {
            // Handle footer position changes if needed
            console.log('Footer position changed to:', position);
          },
          updateSectionFooterPadding: () => this.updateSectionFooterPadding()
        });

        const lazyItems = document.querySelectorAll('[data-lazy-web-view-src]'),
            totalLazy = lazyItems.length;
        if ( totalLazy ){
          let timeout = 0;
          lazyItems.forEach((item) => {
            setTimeout(() => {
              item.setAttribute('src', item.getAttribute('data-lazy-web-view-src'));
            }, timeout || 50);
            timeout += 100;
          });

          setTimeout(() => {
            //this.postMessage('loadFinished', {success: true});

            const tables = document.querySelectorAll('table');
            if (tables.length){
              tables.forEach((table) => {
                if( table.clientWidth > window.screen.width ){
                  table.style.width = '99vw';
                }
              });
            }
          }, Math.min(1200, totalLazy * 200) );
        }

        this.logMsg('loadFinished');
        
        // Update FAQ container after render if FAQ data is available
        if (this.faqData && this.faqData.length > 0) {
          console.log('Updating FAQ container after render with', this.faqData.length, 'items');
          setTimeout(() => {
            this.updateFaqContainer();
          }, 100);
        }

        const sectionFooter = document.querySelector('.section-footer');
        if (sectionFooter) {
          const resizeObserver = new ResizeObserver(() => {
            this.updateSectionFooterPadding();
          });
          resizeObserver.observe(sectionFooter);
        }
      } catch (error) {
        const msg = error.message;

        this.postMessage('loadFinished', { success: false, error:  msg });

        this.logMsg('loadFail: ' + msg);
      }
    }

    renderSearchResults() {
      const searchResultsDiv = document.getElementById('searchResults');
      if (!searchResultsDiv) return;

      const state = this.searchManager.getState();
      
      if (state.items.length === 0 && !state.isFallback) {
        searchResultsDiv.innerHTML = '';
        return;
      }

      // Render search results using SearchManager's built-in renderer
      const html = this.searchManager.renderSearchResultsHTML();
      searchResultsDiv.innerHTML = html;

      // Event listeners for search results are set up only once in setupSearchResultsListener()
      // No need to recreate them on each renderSearchResults() call
    }

    setupSearchResultsListener() {
      // Set up event delegation for search results (only once)
      const searchResultsDiv = document.getElementById('searchResults');
      if (!searchResultsDiv) return;

      searchResultsDiv.addEventListener('click', (e) => {
        // Handle load-more button clicks
        const loadMoreBtn = e.target.closest('.load-more-btn[data-page="search"]');
        if (loadMoreBtn) {
          // Add loading state
          loadMoreBtn.classList.add('loading');
          
          const nextPage = this.searchManager.getCurrentSearchPage() + 1;
          
          this.postMessage('search', {
            page: nextPage,
            query: this.searchManager.getSearchQuery(),
            type: 'manual'
          });
          return;
        }

        // Handle search result items click
        const resultItem = e.target.closest('.search-result-item');
        if (resultItem) {
          const id = resultItem.getAttribute('data-id');
          const type = resultItem.getAttribute('data-type');
          
          console.log('Search result clicked:', { id, type });
          this.postMessage('selectTopic', {
            id: id,
            type: type,
          });
        }
      });
    }

    setSearchResults(results) {
      console.log('Search results received:', results);
      
      // Auto-detect: if we have existing results, this is an append operation
      const hasExistingResults = this.searchManager.getItems().length > 0;
      const page = hasExistingResults ? this.searchManager.getCurrentSearchPage() + 1 : 1;
      
      this.searchManager.setSearchResults(results, page);
      this.renderSearchResults();
      
      // Remove loading state when appending (page > 1)
      if (page > 1) {
        this.removeLoadMoreButtonLoadingState();
      }
    }

    /**
     * Removes loading state from search load-more button
     * @private
     */
    removeLoadMoreButtonLoadingState() {
      const searchResults = document.getElementById('searchResults');
      if (!searchResults) return;
      
      const loadMoreBtn = searchResults.querySelector('.load-more-btn[data-page="search"]');
      if (loadMoreBtn) {
        loadMoreBtn.classList.remove('loading');
      }
    }

    fixMalformedUrl (url) {
      url = url.trim();

      if (url.startsWith('http://https//')) {
        url = url.replace('http://https//', 'https://');
      } else if (url.startsWith('https//')) {
        url = url.replace('https//', 'https://');
      } else if (url.startsWith('http//')) {
        url = url.replace('http//', 'http://');
      }

      try {
        let fixedUrl = new URL(url);
        return fixedUrl.href;
      } catch (e) {
        this.logMsg('Error: ' + e.message);
        return url;
      }
    }

    addHandleEvent() {
      /**
       * Event click download confirm links
       */
      const downloadConfirmLinks = document.querySelectorAll('.content-inner a.download-confirm');
      if (downloadConfirmLinks.length > 0) {
        downloadConfirmLinks.forEach(link => {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const href = link.getAttribute('href');
            const fileName = link.getAttribute('data-name') || 'Unknown';
           
            // console.log('Download confirmed:', {
            //   fileName: fileName,
            //   href: href,
            //   url: href
            // });
            
            this.postMessage('toDownload', {
               fileName: fileName,
               url: href   
            });
          });
        });
      }

      /**
       * Event click send id cate
       */
      const btnCate = document.getElementById("btn-cate");
      if (btnCate) {
        btnCate.addEventListener('click', (e) => {
          e.preventDefault();
          const cateId = e.target.getAttribute("data-id");
          const cateTitle = e.target.getAttribute("data-title");

          this.postMessage('searchCate', { id: cateId, title: cateTitle });
        });
      }

      /**
       * Event click FAQ items
       */
      const faqItems = document.querySelectorAll('.faq-item[data-type="faq"]');
      if (faqItems.length > 0) {
        faqItems.forEach(item => {
          item.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const id = item.getAttribute('data-id');
            const type = item.getAttribute('data-type');

            console.log('FAQ item clicked:', { id, type });
            this.postMessage('selectFaq', {
              id: id,
              type: type,
            });
          });
        });
      }

      /**
       * Event click scroll to ....
       */
      const tocLinks = document.querySelectorAll('.toc-link');
      if (tocLinks.length > 0) {
        tocLinks.forEach(tocLink => {
          tocLink.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = e.target.getAttribute('href').substring(1);  // Get the target id
            const targetElement = document.getElementById(targetId);

            if (targetElement) {
              const scrollOptions = {
                top: targetElement.offsetTop - 20, // Adjust scroll position
                behavior: 'smooth' // Smooth scroll
              };

              if(!this.isAppCall) {
                const container = document.querySelector('.faker-phone--screen');
                container.scrollTo(scrollOptions);
              } else {
                // Scroll to the target element
                window.scrollTo(scrollOptions)
              }
            }
          });
        });
      }

      /**
       * Event click collapse table of content
       */
      const btnArrows = document.querySelectorAll('.btn-arrow');
      if (btnArrows.length > 0) {
        // Add click event listener to each btn-arrow
        btnArrows.forEach(btnArrow => {
          btnArrow.addEventListener('click', function() {
            const submenu = this.parentElement.querySelector('.toc-submenu');

            // Check if submenu exists
            if (!submenu) return;
            submenu.classList.toggle('open');
            this.classList.toggle('open');

            if (submenu.classList.contains('open')) {
              // Calculate the height of the submenu
              submenu.style.display = 'block';
              const height = submenu.scrollHeight + 'px';
              submenu.style.height = '0';

              setTimeout(() => {
                submenu.style.height = height;
              }, 10);

            } else {
              // Close the submenu
              submenu.style.height = submenu.scrollHeight + 'px';

              // Set timeout to delay height change for transition
              setTimeout(() => {
                submenu.style.height = '0';
                // Hide submenu after transition ends
                setTimeout(() => {
                  submenu.style.display = 'none';
                }, 350);
              }, 10);
            }
          });
        });
      }

      const scrollToTopBtn = document.getElementById('scrollToTopBtn');

      if (scrollToTopBtn) {
        const handleScrollTop = (scrollContainer) => {
          if(!scrollContainer) {
            return
          }
          scrollContainer.scrollTo({
            top: 0,
            behavior: 'smooth' // Smooth scroll
          });
        };

        if(!this.isAppCall) {
          const container = document.querySelector('.faker-phone--screen');
          scrollToTopBtn.addEventListener('click', () => handleScrollTop(container));
        } else {
          scrollToTopBtn.addEventListener('click', () => handleScrollTop(document.querySelector('body')));
        }
      }

      document.querySelectorAll('.redirect-page').forEach(item => {
      item.addEventListener('click', () => {
        const page = item.dataset.page;
        this.postMessage('redirectPage', {
          page
        });
      });
    });
    }

    validURL(str){
      var pattern = new RegExp('^(https?:\\/\\/)?' + // protocol
          '((([a-z\\d]([a-z\\d-]*[a-z\\d])*)\\.)+[a-z]{2,}|'+ // domain name
          '((\\d{1,3}\\.){3}\\d{1,3}))' + // OR ip (v4) address
          '(\\:\\d+)?' + // port
          '(\\/[-a-z\\d%_.~+]*)*' + // path
          '(\\?[;&a-z\\d%_.~+=-]*)?' + // query string
          '(\\#[-a-z\\d_]*)?$','i'); // fragment locator
      return !!pattern.test(str);
    }

    // postMessage(fncName, msg) {
    //   msg = JSON.stringify(msg);
    //
    //   if ('webkit' in window) {
    //     window.webkit.messageHandlers[fncName].postMessage(msg);
    //   } else if ('android' in window) {
    //     (window.android || window.Android)[fncName](msg);
    //   }
    //
    //   this.logMsg(JSON.stringify(arguments || {}));
    // }

    postMessage (fncName, msg) {
      try {
        if (window[fncName]?.postMessage) {
          window[fncName].postMessage(JSON.stringify(msg));
        }
      } catch (error) {
        console.error('An error occurred while calling the postMessage function:', error);
      }
    }

    updateFaqContainer() {
      const faqContainer = document.getElementById('faq-container');
      console.log('updateFaqContainer called - faqContainer exists:', !!faqContainer);
      console.log('Current faqData:', this.faqData);
      
      if (!faqContainer) {
        console.warn('FAQ container not found! Did you forget to call render() first?');
        return;
      }
      
      if (faqContainer) {
        faqContainer.innerHTML = this.renderFaqItems();
        console.log('FAQ container innerHTML updated');
        
        // Re-attach event listeners to FAQ items
        const faqItems = faqContainer.querySelectorAll('.faq-item');
        console.log('FAQ items found:', faqItems.length);
        
        if (faqItems.length > 0) {
          faqItems.forEach(item => {
            item.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();
              const id = item.getAttribute('data-id');
              const type = item.getAttribute('data-type');

              console.log('FAQ item clicked:', { id, type });
              this.postMessage('selectFaq', {
                id: id,
                type: type,
              });
            });
          });
        }
      }
    }

    logMsg () {
      if (window.debug ||
          window.location.search.indexOf('debug=1') > 0) {
        console.log(performance.now(), arguments[0] || '');
      }
    }
  }

  let manualDetail = new ManualDetail();

  window.setDataManual = function(data, isDebug) {

    // mobile device
    if (manualDetail.isWebviewBrowser){
      window.setDataApp = function(data) {
        manualDetail.appData = data;
        
        // Extract and update FAQ data - handle both faq and dataFaq properties
        const faqData = data.faq || data.dataFaq;
        if (faqData && Array.isArray(faqData)) {
          manualDetail.faqData = faqData;
          console.log('FAQ data updated from setDataApp:', manualDetail.faqData);
          
          // Update FAQ container if it exists
          manualDetail.updateFaqContainer();

          manualDetail.updateSectionFooterPadding();
        }
      };

      window.postDOMContentLoaded = function( ) {
        window.postLoadFinished = function( data) {
          manualDetail.postMessage(
              'loadFinished', {success: true}
          );

          delete window.initManual;
          delete window.setDataManual;
          delete window.setDataApp;
          delete window.postLoadFinished;
        };

        setTimeout(function() {
            manualDetail.postMessage(
              'javascriptLoaded', manualDetail.paramsDOMLoaded
            );

            const loading = document.getElementById('img-loading');
            if( loading ) loading.remove();

        }, 100);

        delete window.postDOMContentLoaded;
      };
    }

    if( isDebug === true ) {
      manualDetail.isWebviewBrowser = isDebug;
    }

    manualDetail.setDataManual(data);

  };

  window.setSearchResults = function(results) {
    manualDetail.setSearchResults(results);
  };

  window.appendSearchResults = function(newResults) {
    manualDetail.appendSearchResults(newResults);
  };

  window.updateDataAfterReset = function(newData) {
    console.log('updateDataAfterReset called with data:', newData);
    
    // Update FAQ data
    if (Array.isArray(newData)) {
      manualDetail.faqData = newData;

      // Update FAQ container with new data
      manualDetail.updateFaqContainer();

      document.querySelectorAll('.toc_container, .toc-content, .section-faq').forEach(section => {
        section.style.display = '';
      });

      manualDetail.updateSectionFooterPadding();
    } else {
      console.warn('newData is not an array:', newData);
    }
  }

})();
